name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: groundsgg/.github/.github/workflows/gradle-ci.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: read
